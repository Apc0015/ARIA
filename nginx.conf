# ARIA nginx: high-concurrency reverse proxy + React web UI
worker_processes  auto;           # one worker per CPU core
worker_rlimit_nofile 65535;       # raise file descriptor limit

events {
    worker_connections  4096;     # connections per worker (total = workers × 4096)
    use epoll;                    # Linux: use efficient event model
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/wasm image/svg+xml;

    # Buffer tuning for API responses
    proxy_buffering         on;
    proxy_buffer_size       8k;
    proxy_buffers           16 8k;
    proxy_busy_buffers_size 16k;

    # Rate limiting zones (shared memory)
    limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=run_limit:10m  rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name _;

        # ARIA is a same-origin application. These headers protect browser
        # sessions and research data without requiring third-party scripts.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; img-src 'self' data: blob:; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

        # Connection limit per IP
        limit_conn conn_limit 100;

        # React web UI (static files)
        root /usr/share/nginx/html;
        index index.html;

        # Cache static React assets aggressively
        location ~* \.(js|css|wasm|png|jpg|ico|svg|ttf|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # React SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Streaming chat (SSE): buffering must be OFF or tokens arrive in clumps
        location /api/chat {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass         http://aria-api:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
        }

        # API: general rate limit (60 req/min per IP)
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass         http://aria-api:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
        }

        # Run creation: stricter limit (5 per min per IP)
        location = /api/runs {
            limit_req zone=run_limit burst=3 nodelay;

            proxy_pass         http://aria-api:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }
    }
}
