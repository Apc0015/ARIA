services:
  aria-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: aria-api:latest
    container_name: aria-api
    restart: unless-stopped
    env_file: .env
    environment:
      - ARIA_SAAS_MODE=true
      - ARIA_CREDENTIALS_KEY=${ARIA_CREDENTIALS_KEY:?Set a Fernet key for tenant credential encryption}
      - ARIA_BOOTSTRAP_ADMIN_EMAIL=${ARIA_BOOTSTRAP_ADMIN_EMAIL:?Set first organization admin email}
      - ARIA_BOOTSTRAP_ADMIN_PASSWORD=${ARIA_BOOTSTRAP_ADMIN_PASSWORD:?Set first organization admin password}
      - ARIA_BOOTSTRAP_TENANT=${ARIA_BOOTSTRAP_TENANT:-ARIA}
      - ARIA_COOKIE_SECURE=true
      - ARIA_ALLOWED_ORIGINS=${ARIA_ALLOWED_ORIGINS:?Set the HTTPS application origin}
      - ARIA_ALLOWED_HOSTS=${ARIA_ALLOWED_HOSTS:?Set the public application host},localhost,127.0.0.1,aria-api
      # Behind the bundled nginx: trust X-Real-IP/X-Forwarded-For for rate limiting
      - ARIA_TRUST_PROXY=true
      - ARIA_MAX_CONCURRENT_RUNS=20
      - ARIA_RATE_LIMIT_RUNS_PER_HOUR=30
      - ARIA_RATE_LIMIT_REQS_PER_MIN=300
      - ARIA_RATE_LIMIT_LOGINS_PER_15_MIN=10
      - SHARED_MEMORY_BACKEND=redis
      - REDIS_URL=redis://aria-redis:6379/0
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials
      - ./missions:/app/missions
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      aria-redis:
        condition: service_healthy

  aria-redis:
    image: redis:7-alpine
    container_name: aria-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aria-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  aria-web:
    image: nginx:alpine
    container_name: aria-web
    restart: unless-stopped
    depends_on:
      aria-api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./aria-report/dist:/usr/share/nginx/html:ro

volumes:
  aria-redis-data:
