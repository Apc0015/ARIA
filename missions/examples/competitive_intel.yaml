mission:
  name: "Competitive Intelligence"

collection:
  topic: "competitive intelligence for REPLACE_WITH_COMPANY_OR_MARKET"
  depth: "medium"
  max_documents: 150
  max_per_source: 25
  languages:
    collect: ["en"]
    translate_to: "en"
  sources:
    enabled: [web, pdf, news, youtube]
    priority:
      web: 10
      news: 9
      pdf: 7
      youtube: 4

authenticated_sources:
  enabled: false
  platforms: []

llm_sources:
  enabled: false
  models:
    - provider: ollama
      model_id: "llama3.1:8b"
      enabled: true
      base_url: "http://localhost:11434"
      max_tokens: 1200
      temperature: 0.3
  query_settings:
    parallel: true
    delay_between_queries: 2
    skip_duplicate_queries: true
  comparison:
    enabled: true
    min_models_for_comparison: 2
    highlight_divergence: true
    confidence_scoring: true

cleaning:
  instructions: |
    Extract competitor moves, product positioning, partnerships, pricing signals,
    customer segments, strengths, weaknesses, and strategic risks.
  output_schema:
    is_relevant: bool
    relevance_score: float
    title: string
    summary: string
    competitor_name: string
    market_segment: string
    key_topics: list
    strengths: list
    weaknesses: list
    opportunities: list
    risks: list
    quality_issues: list

output:
  formats: [json, csv, markdown]
  sort_by: "relevance_score"
  sort_order: "desc"
