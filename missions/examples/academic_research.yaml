mission:
  name: "Generic Academic Research"

collection:
  topic: "REPLACE_WITH_YOUR_TOPIC"
  depth: "medium"
  max_documents: 200
  languages:
    collect: ["en"]
    translate_to: "en"
  sources:
    enabled: [academic, web, pdf]
    priority:
      academic: 10
      pdf: 8
      web: 6

authenticated_sources:
  enabled: true
  platforms:
    - name: ieee
      max_results: 50
    - name: acm
      max_results: 50
    - name: springer
      max_results: 30
    - name: university_library
      fallback_for_paywalls: true

llm_sources:
  enabled: false
  models:
    - provider: ollama
      model_id: "llama3.1:8b"
      enabled: true
      base_url: "http://localhost:11434"
      max_tokens: 1500
      temperature: 0.3
    - provider: ollama
      model_id: mistral
      enabled: true
      base_url: "http://localhost:11434"
      max_tokens: 1500
      temperature: 0.3
    - provider: openrouter
      model_id: "anthropic/claude-3.5-haiku"
      enabled: false
      max_tokens: 1500
      temperature: 0.3
  query_settings:
    parallel: true
    delay_between_queries: 2
    skip_duplicate_queries: true
  comparison:
    enabled: true
    min_models_for_comparison: 2
    highlight_divergence: true
    confidence_scoring: true

cleaning:
  instructions: |
    Extract structured information from this academic document.
    Focus on research methodology, key findings, conclusions,
    and practical implications.
  output_schema:
    is_relevant: bool
    relevance_score: float
    document_info:
      title: string
      authors: list
      abstract: string
      methodology: string
      key_findings: list
      conclusions: string
      practical_implications: list
      limitations: list
      future_work: string
      publication_venue: string
      publication_year: int
    key_topics: list
    quality_issues: list

output:
  formats: [json, csv, markdown]
  sort_by: "relevance_score"
  sort_order: "desc"
