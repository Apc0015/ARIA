<!doctype html>
<html lang="en">
  <head>
    <!-- Apply appearance before paint: saved choice, else system preference -->
    <script>(function(){var t=localStorage.getItem('aria-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.className=t;})();</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ARIA — automated research collection and intelligence. Give it a topic; it gathers, cleans, and scores the evidence." />
    <title>ARIA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
